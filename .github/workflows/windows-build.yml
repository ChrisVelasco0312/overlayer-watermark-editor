name: Windows Build

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve app meta
        id: meta
        shell: bash
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "bin=$(awk -F'"' '/^name/{print $2; exit}' src-tauri/Cargo.toml)" >> "$GITHUB_OUTPUT"
          echo "product=$(node -e "console.log(require('./src-tauri/tauri.conf.json').productName)")" >> "$GITHUB_OUTPUT"

      - name: Verify package.json and tauri.conf.json versions match
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAURI=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$PKG" != "$TAURI" ]; then
            echo "::error::Version mismatch: package.json=$PKG tauri.conf.json=$TAURI"
            exit 1
          fi

      - name: Install pnpm (version from packageManager field)
        uses: pnpm/action-setup@v4

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app (NSIS installer)
        run: pnpm tauri build --bundles nsis

      - name: Collect artifacts
        id: artifacts
        shell: pwsh
        run: |
          $binName = "${{ steps.meta.outputs.bin }}"
          $version = "${{ steps.meta.outputs.version }}"

          $exe = Get-ChildItem -Path "src-tauri/target" -Recurse -Filter "$binName.exe" |
            Where-Object { $_.FullName -match '\\release\\' -and $_.FullName -notmatch '\\nsis\\' } |
            Select-Object -First 1
          if (-not $exe) { throw "Portable executable '$binName.exe' not found under src-tauri/target" }

          $installer = Get-ChildItem -Path "src-tauri/target" -Recurse -Filter "*setup*.exe" |
            Where-Object { $_.FullName -match '\\nsis\\' } |
            Select-Object -First 1
          if (-not $installer) { throw "No NSIS installer matching *setup*.exe found under src-tauri/target" }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $exe.FullName "dist/Overlayer-portable-$version.exe"
          Copy-Item $installer.FullName "dist/$($installer.Name)"

          "installer=dist/$($installer.Name)" >> $env:GITHUB_OUTPUT
          "portable=dist/Overlayer-portable-$version.exe" >> $env:GITHUB_OUTPUT

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: Overlayer v${{ steps.meta.outputs.version }}
          files: |
            ${{ steps.artifacts.outputs.installer }}
            ${{ steps.artifacts.outputs.portable }}
          generate_release_notes: true
